<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kneeboard checklists | P2006T</title>
    <style>
      /* Each sheet is one landscape letter page holding two checklists, one per
         half, so a sheet folds down the middle to kneeboard size. */
      @page {
        size: 11in 8.5in;
        margin: 0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #dfe4e9;
        color: #000;
        font-family: 'Minion Pro', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .tools {
        display: flex;
        gap: 1rem;
        align-items: center;
        width: 11in;
        max-width: 100%;
        margin: 0 auto;
        padding: 0.9rem 0.25rem;
        font: 600 1rem/1.3 system-ui, sans-serif;
      }

      .tools p {
        flex: 1;
        color: #3d4b58;
        font-weight: 400;
      }

      .tools a {
        color: #13212e;
      }

      .tools button {
        min-height: 2.6rem;
        padding: 0.4rem 1.3rem;
        border: 0;
        border-radius: 999px;
        background: #1750c4;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .sheet {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 11in;
        height: 8.5in;
        margin: 0 auto 0.4in;
        background: #fff;
        box-shadow: 0 2px 14px rgb(0 0 0 / 0.22);
        break-after: page;
        break-inside: avoid;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 8.5in;
        padding: 0.4in 0.34in;
        overflow: hidden;
        font-size: 22pt;
        font-weight: 500;
        line-height: 1.2;
      }

      /* The fold line. */
      .panel + .panel {
        border-left: 1px dashed #9aa5af;
      }

      h1 {
        margin-bottom: 0.4em;
        padding-bottom: 0.12em;
        border-bottom: 4px solid #000;
        font-size: 1.45em;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      h1 sub {
        font-size: 0.6em;
      }

      ol {
        padding: 0.4em 0.5em;
        border: 3.5px solid #000;
        list-style: none;
      }

      ol > li {
        display: flex;
        gap: 0.4em;
        align-items: flex-start;
      }

      ol > li + li {
        margin-top: 0.32em;
      }

      .chk {
        display: flex;
        flex: 1;
        min-width: 0;
        /* A wrapped item keeps its dots and action on its last line. */
        align-items: last baseline;
        text-wrap: balance;
      }

      /* A wrapped action hangs below the item instead. */
      .chk--tall {
        align-items: baseline;
      }

      .chk__dots {
        flex: 1 0 1em;
        overflow: hidden;
        white-space: nowrap;
      }

      .chk__dots::before {
        content: '....................................................................................................................................................................................';
        letter-spacing: 0.08em;
      }

      .chk__act {
        flex: 0 1 auto;
        max-width: 68%;
        font-weight: 700;
        text-align: right;
        text-transform: uppercase;
      }

      .chk__star {
        color: #c1121f;
        font-weight: 800;
      }

      ul {
        margin-top: 0.55em;
        padding-left: 1.1em;
        font-size: 0.8em;
      }

      ul li + li {
        margin-top: 0.2em;
      }

      .note {
        margin-top: 0.5em;
        font-size: 0.8em;
        font-style: italic;
      }

      .note b {
        color: #c1121f;
        font-style: normal;
      }

      @media print {
        body {
          background: #fff;
        }

        .tools {
          display: none;
        }

        .sheet {
          margin: 0;
          box-shadow: none;
        }

        .sheet:last-child {
          break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="tools">
      <a href="./">Back to the cards</a>
      <p>Landscape pages, two checklists each. Print at 100% and fold down the middle.</p>
      <button type="button" id="print">Print</button>
    </div>
    <main id="sheets"></main>
    <script type="module">
      import { DECKS } from './cards.js';

      // The checklists to print, in order, two per sheet. Steps come from the
      // cards; a third entry swaps individual steps for the printed page.
      const PAGES = [
        ['man.steep', 'Steep Turn'],
        ['man.slow', 'Slow Flight', { 'Airspeed: 65 knots': 'Airspeed: 70 knots' }],
        ['man.power-off', 'Power-Off Stall'],
        ['man.power-on', 'Power-On Stall'],
        ['man.vmc-demo', 'V_MC Demo'],
        ['drill.the-drill', 'The Drill'],
        ['drill.secure', 'Secure Engine'],
      ];
      const MAX_PT = 22;
      const MIN_PT = 11;

      const cards = new Map(DECKS.flatMap((deck) => deck.cards).map((card) => [card.id, card]));
      const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      const fmt = (s) => esc(s).replace(/\bV_([A-Z0-9]+)/g, 'V<sub>$1</sub>');

      function stepHTML(text) {
        const at = text.indexOf(': ');
        if (at < 0) return `<span class="chk"><span>${fmt(text)}</span></span>`;
        const action = fmt(text.slice(at + 2)).replace(/\*$/, '<span class="chk__star">*</span>');
        return `<span class="chk"><span>${fmt(text.slice(0, at))}</span><span class="chk__dots" aria-hidden="true"></span><span class="chk__act">${action}</span></span>`;
      }

      function panelHTML([id, title, swaps = {}]) {
        const card = cards.get(id);
        const steps = card.steps.map((s) => swaps[s] ?? s);
        const bullets = card.bullets ? `<ul>${card.bullets.map((b) => `<li>${fmt(b)}</li>`).join('')}</ul>` : '';
        const note = card.note ? `<p class="note">${fmt(card.note).replace(/^\*/, '<b>*</b>')}</p>` : '';
        return `<section class="panel"><h1>${fmt(title)}</h1><ol>${steps.map((s) => `<li>${stepHTML(s)}</li>`).join('')}</ol>${bullets}${note}</section>`;
      }

      const sheets = [];
      for (let i = 0; i < PAGES.length; i += 2) {
        const pair = PAGES.slice(i, i + 2).map(panelHTML);
        if (pair.length < 2) pair.push('<section class="panel"></section>');
        sheets.push(`<div class="sheet">${pair.join('')}</div>`);
      }
      document.getElementById('sheets').innerHTML = sheets.join('');

      // Use the largest type that keeps each checklist on its half page.
      function fit() {
        for (const panel of document.querySelectorAll('.panel')) {
          let pt = MAX_PT;
          panel.style.fontSize = `${pt}pt`;
          while (pt > MIN_PT && panel.scrollHeight > panel.clientHeight) {
            pt -= 0.5;
            panel.style.fontSize = `${pt}pt`;
          }
        }
        for (const act of document.querySelectorAll('.chk__act')) {
          const oneLine = parseFloat(getComputedStyle(act).lineHeight) * 1.5;
          act.parentElement.classList.toggle('chk--tall', act.offsetHeight > oneLine);
        }
      }
      (document.fonts?.ready || Promise.resolve()).then(fit);

      document.getElementById('print').addEventListener('click', () => window.print());
    </script>
  </body>
</html>
